
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Assessment | SkillBridge AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6ff;
      color: #252545;
      padding: 30px 15px;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    h1 {
      color: #4f46e5;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3730a3;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      background: #eefcf7;
      border-radius: 10px;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #4f46e5;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <a class="back" href="index.html">← Back to Home</a>

    <h1>Skill Assessment</h1>
    <p class="subtitle">
      Tell us about yourself and your career goals.
    </p>

    <form id="assessmentForm">

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="education">Education</label>
      <select id="education" required>
        <option value="">Select education</option>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>B.Sc</option>
        <option>MCA</option>
        <option>Other</option>
      </select>

      <label for="career">Target Career</label>
      <select id="career" required>
        <option value="">Select your career goal</option>
        <option>Software Developer</option>
        <option>AI / ML Engineer</option>
        <option>Data Scientist</option>
        <option>Web Developer</option>
        <option>UI / UX Designer</option>
      </select>

      <label for="skills">Your Current Skills</label>
      <textarea id="skills" placeholder="Example: HTML, CSS, Python..." required></textarea>

      <label for="experience">Experience Level</label>
      <select id="experience" required>
        <option value="">Select experience</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>

      <button type="submit">Submit Assessment</button>

    </form>

    <div id="result"></div>

  </div>

  
<script>
document.getElementById("assessmentForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const education = document.getElementById("education").value;
    const career = document.getElementById("career").value;
    const skills = document.getElementById("skills").value;
    const experience = document.getElementById("experience").value;

    const assessmentData = {
        name: name,
        education: education,
        career: career,
        skills: skills,
        experience: experience
    };

    try {
        const response = await fetch("http://127.0.0.1:5000/api/assessment", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(assessmentData)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Something went wrong");
        }

        sessionStorage.setItem("name", name);
        sessionStorage.setItem("education", education);
        sessionStorage.setItem("career", career);
        sessionStorage.setItem("skills", skills);
        sessionStorage.setItem("experience", experience);

        sessionStorage.setItem("assessmentData", JSON.stringify(result.assessment));

        window.location.href = "dashboard.html";

    } catch (error) {
        alert("Backend connection failed: " + error.message);
        console.error(error);
    }
});
</script>
